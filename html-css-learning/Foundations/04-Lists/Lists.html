<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Unordered List</h2>
    <ul>
        <li>Apple</li>
        <li>Orange</li>
        <li>Grape</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Pick the fruit</li>
        <li>Cut the fruit</li>
        <li>Eat the Fruit</li>
    </ol>

    <h2>Description List</h2>
    <dl>
        <dt>Apple</dt>
        <dd>It's a red color fruit</dd>
        <dt>Grape</dt>
        <dd>It's a fruit that use to create vine.</dd>
    </dl>
</body>
</html>
