<!DOCTYPE html>
<html lang="en">
<head>

    <title>Table</title>
</head>
<body>

        <caption>Learning Progress</caption>

        <thead>
            <tr>
                <th scope="col">Topic</th>
                <th scope="col">Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Coding</td>
                <td>Learning</td>
            </tr>
            <tr>
                <td>Skills</td>
                <td>Practicing</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
